name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write

# ─────────────────────────────────────────────────────────────────────────────
# Three independent jobs run in parallel:
#   1. unit-tests   – native Linux build, no hardware, fast (~30s)
#   2. static-analysis – cppcheck, catches bugs the compiler misses (~20s)
#   3. compile-firmware – full ESP32 Arduino build, catches HW-specific errors (~4min)
# ─────────────────────────────────────────────────────────────────────────────

jobs:

  # ═══════════════════════════════════════════════════════════════════════════
  # JOB 1: Native unit tests (pure logic, no ESP32 toolchain)
  # ═══════════════════════════════════════════════════════════════════════════
  unit-tests:
    name: Unit Tests (native Linux)
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get install -y --no-install-recommends doctest-dev g++ cmake cppcheck

      - name: Configure CMake
        run: |
          cmake -S tests/native \
                -B tests/native/build \
                -DCMAKE_BUILD_TYPE=Debug

      - name: Build tests
        run: cmake --build tests/native/build --parallel

      - name: Run tests (verbose)
        run: |
          cd tests/native/build
          ./test_logger -v

      - name: Run tests (JUnit XML for GitHub annotations)
        if: always()
        run: |
          cd tests/native/build
          ./test_logger --reporters=junit --out=test_results.xml || true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: tests/native/build/test_results.xml

  # ═══════════════════════════════════════════════════════════════════════════
  # JOB 2: Static analysis — cppcheck
  # ═══════════════════════════════════════════════════════════════════════════
  static-analysis:
    name: Static Analysis (cppcheck)
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install cppcheck
        run: sudo apt-get install -y --no-install-recommends cppcheck

      - name: Run cppcheck on sketch sources
        run: |
          cppcheck \
            --enable=all \
            --suppress=missingIncludeSystem \
            --suppress=missingInclude \
            --suppress=unmatchedSuppression \
            --suppress=checkersReport \
            --inline-suppr \
            --error-exitcode=1 \
            --std=c++11 \
            -I PZEM_Logger \
            --template='{file}:{line}: [{severity}] {message} ({id})' \
            PZEM_Logger/Config.h \
            PZEM_Logger/Logger.h \
            PZEM_Logger/StatusLed.h \
            PZEM_Logger/WebPortal.h \
            PZEM_Logger/WebPortal.cpp \
            PZEM_Logger/PZEM_Logger.ino \
            2>&1 | tee cppcheck_report.txt

      - name: Upload cppcheck report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cppcheck-report
          path: cppcheck_report.txt

  # ═══════════════════════════════════════════════════════════════════════════
  # JOB 3: Compile firmware for ESP32 (existing test, kept as-is)
  # ═══════════════════════════════════════════════════════════════════════════
  compile-firmware:
    name: Compile for ESP32-WROOM
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up arduino-cli
        uses: arduino/setup-arduino-cli@v2
        with:
          version: "0.35.3"

      - name: Install ESP32 core
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls \
            https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@2.0.17

      - name: Install PZEM library
        run: arduino-cli lib install "PZEM004Tv30@1.1.2"

      - name: Compile firmware
        run: |
          arduino-cli compile \
            --fqbn esp32:esp32:esp32 \
            --output-dir build/ \
            PZEM_Logger/

      - name: Collect build artefacts
        run: |
          mkdir -p firmware
          cp build/PZEM_Logger.ino.bin        firmware/
          cp build/PZEM_Logger.ino.elf        firmware/
          cp build/PZEM_Logger.ino.bootloader.bin firmware/
          cp build/PZEM_Logger.ino.partitions.bin firmware/

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ github.sha }}
          path: firmware/
          retention-days: 90

      - name: Create GitHub Release
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: "Firmware build #${{ github.run_number }}"
          body: |
            Automated firmware build from commit ${{ github.sha }}

            **Flash command:**
            ```bash
            esptool.py --chip esp32 --baud 460800 write_flash \
              0x1000  PZEM_Logger.ino.bootloader.bin \
              0x8000  PZEM_Logger.ino.partitions.bin \
              0x10000 PZEM_Logger.ino.bin
            ```
          files: firmware/*
